          v_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          v_PROVIDER_URL_TESTNET: ${{ secrets.PROVIDER_URL_TESTNET }}
          v_REDIS_URL: ${{ secrets.REDIS_URL }}
          v_RETH_STRATEGY: ${{ secrets.RETH_STRATEGY }}
          v_RPC_URL: ${{ secrets.RPC_URL }}
          v_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
