          set +x
          if [ -n "$v_API_KEY_ALCHEMY" ]; then echo "S|API_KEY_ALCHEMY|$(printf %s "$v_API_KEY_ALCHEMY" | base64 -w0)|x"; else echo "S|API_KEY_ALCHEMY|EMPTY|-"; fi
